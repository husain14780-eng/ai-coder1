name: Build GameForge V6.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gameforge-v61-android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"
  ANDROID_NDK: "ndk;29.0.13113456"
  ANDROID_CMAKE: "cmake;3.31.6"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build_source
          mkdir -p build_source

          zip_file="$(find . -maxdepth 3 -type f -name 'GameForge_v61_2D_RPG_MAX.zip' -print -quit || true)"
          if [[ -n "$zip_file" ]]; then
            unzip -tq "$zip_file"
            unzip -q "$zip_file" -d build_source
          elif [[ -f settings.gradle.kts && -d app ]]; then
            rsync -a --exclude='.git' --exclude='build_source' ./ build_source/
          else
            echo "ERROR: no source archive or Gradle project found." >&2
            exit 1
          fi

          settings_file="$(find build_source -type f -name 'settings.gradle.kts' -print -quit || true)"
          [[ -n "$settings_file" ]] || { echo "ERROR: settings.gradle.kts not found." >&2; exit 1; }

          project_dir="$(dirname "$settings_file")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "${{ env.ANDROID_PLATFORM }}" \
            "${{ env.ANDROID_BUILD_TOOLS }}" \
            "${{ env.ANDROID_NDK }}" \
            "${{ env.ANDROID_CMAKE }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace :app:clean :app:assembleDebug
