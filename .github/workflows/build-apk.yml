name: Build GameForge V71 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: gameforge-v71-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate and extract the GameForge V7 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_source
          mkdir -p build_source

          ZIP="$(find . -maxdepth 3 -type f \
            \( -iname 'GameForge_V71_2D_RPG_FINAL_MAX_INTERNAL_RELEASE3.zip' -o -iname 'GameForge_V71_2D_RPG_FINAL_MAX_INTERNAL_RELEASE2.zip' -o -iname 'GameForge_V71_2D_RPG_FINAL_MAX_INTERNAL.zip' -o -iname 'GameForge_v71_2D_RPG_FINAL_MAX_INTERNAL.zip' -o -iname 'GameForge*V71*2D*RPG*FINAL*MAX*INTERNAL*.zip' \) \
            -print | sort | head -n 1 || true)"
          if [[ -n "$ZIP" ]]; then
            echo "Using source archive: $ZIP"
            unzip -tq "$ZIP"
            unzip -q "$ZIP" -d build_source
          elif [[ -f "settings.gradle.kts" && -d "app" ]]; then
            echo "No V7 archive found; repository root already contains the Gradle source."
            rsync -a --exclude='.git' --exclude='build_source' ./ build_source/
          else
            echo 'ERROR: No GameForge V7 ZIP and no direct Gradle source checkout found.' >&2
            exit 1
          fi

          SETTINGS_FILE="$(find build_source -type f -name 'settings.gradle.kts' -print -quit || true)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo 'ERROR: settings.gradle.kts not found after source preparation.' >&2
            find build_source -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/VERSION.txt"
          test -f "$PROJECT_DIR/tools/audit_v7.py"
          test -f "$PROJECT_DIR/.github/workflows/build-apk.yml" || true

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Prepared source root: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK / NDK / CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.31.6'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Validate V71 internal-only release metadata, memory safety and deep audits
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 tools/check_release.py .
          python3 tools/check_jvm_targets.py .
          python3 tools/check_kotlin_compat.py .
          python3 tools/check_native_api.py .
          python3 tools/check_inapp_features.py .
          python3 tools/check_memory_safety.py .
          python3 - <<'PY'
from pathlib import Path

root = Path(".")
excluded_dirs = {".git", "build"}
entries = []
for p in root.rglob("*"):
    if not p.is_file():
        continue
    rel = p.relative_to(root).as_posix()
    parts = rel.split("/")
    if any(part in excluded_dirs for part in parts[:-1]):
        continue
    if rel.endswith(".apk") or rel.endswith(".sha256") or rel == "FILES.txt":
        continue
    entries.append(rel)

Path("FILES.txt").write_text("\n".join(sorted(entries)) + "\n")
print(f"Regenerated FILES.txt: {len(entries)} source files")
PY
          python3 tools/audit_v7.py

      - name: Validate source inventory and workflow inputs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 -m compileall -q tools
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root = Path('.')
          layout = root / 'app/src/main/res/layout/activity_main.xml'
          xml = ET.parse(layout).getroot()
          ids = {v for e in xml.iter() for k,v in e.attrib.items() if k.endswith('}id') or k == 'android:id'}
          refs = set()
          for p in (root / 'app/src/main/java').rglob('*.kt'):
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', p.read_text(encoding='utf-8', errors='replace')))
          missing = sorted(x for x in refs if '@+id/' + x not in ids and '@id/' + x not in ids)
          assert not missing, 'missing layout IDs: ' + ', '.join(missing)
          assert not list((root/'app/src/main').rglob('*AccessibilityService*')), 'accessibility source remains'
          assert not list((root/'app/src/main').rglob('*ScreenCaptureService*')), 'screen capture source remains'
          print(f'source inventory/input validation: PASS ({len(refs)} referenced view IDs)')
          PY

      - name: Verify Gradle Android release metadata
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'namespace = "com.husain.aicoder"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.husain.aicoder"' app/build.gradle.kts
          grep -Fq 'versionCode = 71' app/build.gradle.kts
          grep -Fq 'versionName = "7.1"' app/build.gradle.kts
          grep -Fq 'package="com.husain.aicoder"' app/src/main/AndroidManifest.xml
          echo "Gradle/manifest metadata: applicationId=com.husain.aicoder versionCode=71 versionName=7.1"

      - name: Build GameForge V71 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK and checksum
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.sha256
          unzip -t "$APK" >/tmp/apk-unzip-check.txt
          test -s /tmp/apk-unzip-check.txt
          command -v aapt >/dev/null
          BADGING="$(aapt dump badging "$APK")"
          printf '%s\n' "$BADGING" | tee /tmp/apk-badging.txt

          PACKAGE_NAME="$(
            printf '%s\n' "$BADGING" |
              sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" |
              head -n 1
          )"

          VERSION_CODE="$(
            printf '%s\n' "$BADGING" |
              sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" |
              head -n 1
          )"

          echo "Parsed APK package name: ${PACKAGE_NAME:-<missing>}"
          echo "Parsed APK versionCode: ${VERSION_CODE:-<missing>}"

          if [[ "$PACKAGE_NAME" != "com.husain.aicoder" ]]; then
            echo "ERROR: unexpected application ID: ${PACKAGE_NAME:-<missing>}"
            echo "Expected: com.husain.aicoder"
            exit 1
          fi

          if [[ "$VERSION_CODE" != "71" ]]; then
            echo "ERROR: unexpected APK versionCode: ${VERSION_CODE:-<missing>}"
            echo "Expected: 71"
            exit 1
          fi

          echo "APK metadata verification: PASS"

          if aapt dump permissions "$APK" | grep -E 'BIND_ACCESSIBILITY_SERVICE|FOREGROUND_SERVICE_MEDIA_PROJECTION'; then
            echo 'ERROR: forbidden device-capture permission leaked into APK' >&2
            exit 1
          fi

      - name: Upload GameForge V71 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gameforge-v71-2d-rpg-final-max-internal-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_DIR }}/app-debug.sha256
          if-no-files-found: error
          retention-days: 14
