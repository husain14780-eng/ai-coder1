name: Build GameForge APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.31.6'

      # This repository intentionally does not ship a Gradle wrapper.
      # AGP 8.13 requires Gradle 8.13.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Validate source release
        run: python3 tools/check_local_swarm_release.py

      - name: Run full v5.1 audit
        run: python3 tools/audit_v5_1.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gameforge-v5.1-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 14
