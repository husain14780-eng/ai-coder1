name: Build GameForge APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GameForge source (extract ZIP when present)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_source
          mkdir -p build_source
          ZIP=$(find . -maxdepth 2 -type f -name 'GameForge_v*.zip' -print -quit || true)
          if [[ -n "$ZIP" ]]; then
            echo "Using source archive: $ZIP"
            unzip -q "$ZIP" -d build_source
          else
            echo "No GameForge ZIP found; using repository checkout as source."
            rsync -a --exclude='.git' --exclude='build_source' ./ build_source/
          fi
          ROOT=$(find build_source -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)
          if [[ -z "$ROOT" || ! -f "$ROOT/app/build.gradle.kts" ]]; then
            echo 'ERROR: Could not locate a Gradle GameForge project after extraction.' >&2
            find build_source -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.31.6'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Validate source release
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/check_local_swarm_release.py

      - name: Run full v5.2 audit
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/audit_v5_1.py

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK and checksum
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gameforge-v5.2-qwen25-coder-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_DIR }}/app-debug.sha256
          if-no-files-found: error
          retention-days: 14
