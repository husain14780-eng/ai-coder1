name: Build GameForge V7.2.1 Unique APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: gameforge-v721-unique-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate exact V7.2.1 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_source
          mkdir -p build_source
          ZIP="./GameForge_V721_UNIQUE_APK_BUILD75.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "ERROR: exact V7.2.1 source archive missing: $ZIP" >&2
            exit 1
          fi
          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d build_source
          SETTINGS_FILE="$(find build_source -type f -name settings.gradle.kts -print -quit || true)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fxq "7.2.1-2D-RPG-FINAL-MAX-INTERNAL-SAFE-STARTUP-UNIQUE-BUILD" "$PROJECT_DIR/VERSION.txt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK / NDK / CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.31.6'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Validate V7.2.1 unique build source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 tools/check_release.py .
          python3 tools/check_jvm_targets.py .
          python3 tools/check_kotlin_compat.py .
          python3 tools/check_native_api.py .
          python3 tools/check_inapp_features.py .
          python3 tools/check_memory_safety.py .
          python3 tools/audit_v7.py
          python3 tools/check_local_swarm_release.py

      - name: Validate import-only model policy
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          # No startup call may invoke the automatic model downloader.
          if grep -RIn --include='*.kt' -E 'ensureDefaultCoderDownloaded[[:space:]]*\(|AUTO_CODER_URL' app/src/main/java; then
            echo 'ERROR: automatic Qwen2.5-Coder downloader still callable from app source' >&2
            exit 1
          fi

      - name: Build V7.2.1 unique debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK identity and permissions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          [[ -x "$AAPT" ]] || AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -path '*/aapt' -perm -111 | sort -V | tail -1 || true)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -Fq "package: name='com.husain.aicoder'" /tmp/apk-badging.txt
          grep -Fq "versionCode='75'" /tmp/apk-badging.txt
          grep -Fq "versionName='7.2.1-2D-RPG-FINAL-MAX-INTERNAL-SAFE-STARTUP-UNIQUE-BUILD'" /tmp/apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          grep -Fq 'android.permission.INTERNET' /tmp/apk-permissions.txt
          grep -Fq 'android.permission.ACCESS_NETWORK_STATE' /tmp/apk-permissions.txt
          if grep -Eq 'BIND_ACCESSIBILITY_SERVICE|FOREGROUND_SERVICE_MEDIA_PROJECTION' /tmp/apk-permissions.txt; then
            echo 'ERROR: forbidden device-capture permission leaked into APK' >&2
            exit 1
          fi
          unzip -tq "$APK"

      - name: Create unique APK filename
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          UNIQUE="GameForge_V7.2.1_BUILD75_RUN${GITHUB_RUN_NUMBER}_${SHORT_SHA}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$UNIQUE"
          sha256sum "dist/$UNIQUE" | tee "dist/$UNIQUE.sha256"
          printf '%s\n' \
            'GameForge V7.2.1 Unique Build' \
            'versionCode=75' \
            "github_run=${GITHUB_RUN_NUMBER}" \
            "github_sha=${GITHUB_SHA}" \
            "apk=$UNIQUE" > dist/BUILD_ID.txt

      - name: Upload unique APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gameforge-v721-unique-run-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ env.PROJECT_DIR }}/dist/*.apk
            ${{ env.PROJECT_DIR }}/dist/*.sha256
            ${{ env.PROJECT_DIR }}/dist/BUILD_ID.txt
          if-no-files-found: error
          retention-days: 14
